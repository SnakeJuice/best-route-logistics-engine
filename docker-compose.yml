version: "3.8"

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: bestroute_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_logistics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Queue & Cache Broker
  redis:
    image: redis:7-alpine
    container_name: bestroute_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Open Source Routing Machine Engine
  osrm:
    image: osrm/osrm-backend:latest
    container_name: bestroute_osrm
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./osrm:/data
    command: osrm-routed --algorithm mld /data/map.osrm

volumes:
  pgdata:
  redisdata:
